    "pandas-stubs (>=2.3.2.250926,<3.0.0.0)",
    "tdqm (>=0.0.1,<0.0.2)",
    "black (>=25.9.0,<26.0.0)",
    "plotly (>=6.3.1,<7.0.0)",
    "ollama (>=0.6.0,<0.7.0)",
    "pull (>=0.0.1,<0.0.2)",
    "mistral (>=21.0.0,<22.0.0)",
    "scikit-learn (>=1.7.2,<2.0.0)",
    "langchain-ollama (>=1.0.0,<2.0.0)",
    "langchain (>=1.0.5,<2.0.0)",
    "google-generativeai (>=0.8.5,<0.9.0)",
